# Session settings
server.servlet.session.timeout=2h
# FIX: Was 'server.servlet.session.cookie.max-age=2h' — Spring expects this value in SECONDS
# (a plain integer), NOT a duration string like '2h'. Using '2h' caused Spring to silently
# ignore the property entirely, meaning the session cookie had no expiry set.
# 7200 seconds = 2 hours — matches the session timeout above.
server.servlet.session.cookie.max-age=7200
