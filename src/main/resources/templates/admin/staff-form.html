<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'create' ? 'Add New Staff Member' : 'Edit Staff Member'}">Staff Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/admin/students">Manage Students</a>
        <a href="/admin/faculty"><strong>Manage Faculty &amp; Staff</strong></a>
        <a href="/logout">Logout (<span th:text="${loggedInUser}">admin</span>)</a>
    </nav>

    <h1 th:text="${mode == 'create' ? 'Add New Staff Member' : 'Edit Staff Member — ' + staff.employeeId}">Staff Form</h1>
    <p>Fill in the details below to update staff employment records.</p>

    <form th:action="${mode == 'create' ? '/admin/faculty/staff/new' : '/admin/faculty/staff/edit/' + staff.employeeId}" method="post" style="max-width: 650px;">
        <table style="width: 100%;">
            <tr>
                <td style="width: 200px;"><strong>Employee ID:</strong></td>
                <td>
                    <input type="text" name="employeeId" th:value="${staff.employeeId}" th:readonly="${mode == 'edit'}" required placeholder="e.g. S003" style="width: 250px;">
                    <small th:if="${mode == 'edit'}" style="color: #666; display: block;">(Primary Key cannot be changed)</small>
                </td>
            </tr>
            <tr>
                <td><strong>First Name:</strong></td>
                <td><input type="text" name="firstName" th:value="${staff.firstName}" required placeholder="First name" style="width: 250px;"></td>
            </tr>
            <tr>
                <td><strong>Middle Name:</strong></td>
                <td><input type="text" name="middleName" th:value="${staff.middleName}" placeholder="Middle name (optional)" style="width: 250px;"></td>
            </tr>
            <tr>
                <td><strong>Last Name:</strong></td>
                <td><input type="text" name="lastName" th:value="${staff.lastName}" placeholder="Last name" style="width: 250px;"></td>
            </tr>
            <tr>
                <td><strong>Contact Number:</strong></td>
                <td><input type="text" name="contactNumber" th:value="${staff.contactNumber}" required placeholder="e.g. 9876500003" style="width: 250px;"></td>
            </tr>
            <tr>
                <td><strong>Designated Role:</strong></td>
                <td>
                    <select name="designatedRole" required style="width: 264px; border: 1px solid #767676; border-radius: 2px; box-sizing: border-box; background-color: #fff;">
                        <option value="" disabled th:selected="${staff.designatedRole == null or staff.designatedRole == ''}">-- Select Role --</option>
                        <option th:each="r : ${roles}"
                                th:value="${r}"
                                th:text="${r}"
                                th:selected="${staff.designatedRole != null and staff.designatedRole.equalsIgnoreCase(r)}">
                        </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><strong>Date of Joining:</strong></td>
                <td><input type="date" name="dateOfJoining" th:value="${staff.dateOfJoining}" required style="width: 250px;"></td>
            </tr>
            <tr>
                <td><strong>Monthly Salary (₹):</strong></td>
                <td><input type="number" step="0.01" name="salary" th:value="${staff.salary}" min="1" required style="width: 250px;"></td>
            </tr>
        </table>

        <div style="margin-top: 20px;">
            <button type="submit" style="background: #2563eb; color: white; padding: 8px 20px; font-weight: bold; border: none; border-radius: 4px;">Save Staff Member</button>
            <a href="/admin/faculty?tab=staff" style="margin-left: 15px; color: #555;">Cancel</a>
        </div>
    </form>
</body>
</html>
