<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — School Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/login">Login</a>
    </nav>

    <h1>Login</h1>

    <div th:if="${error}" class="error" th:text="${error}">Error</div>

    <form method="post" action="/login" style="max-width: 320px;">
        <label>User ID or Username:<br>
            <input type="text" id="userId" name="userId" th:value="${userId}" placeholder="e.g. A001, T001, S001, admin" required style="width: 100%;">
        </label><br><br>

        <label>Password:<br>
            <input type="password" id="password" name="password" placeholder="Enter password" required style="width: 100%;">
        </label><br><br>

        <button type="submit" class="btn" style="background: #2563eb; color: white; border: none; border-radius: 4px; padding: 8px 16px;">Login</button>
    </form>

    <br>
    <div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 6px; max-width: 450px; font-size: 13px; color: #475569;">
        <strong>Default Test Credentials:</strong>
        <ul style="margin: 6px 0 0 18px; padding: 0;">
            <li><strong>Admin:</strong> <code>admin</code> / <code>admin123</code></li>
            <li><strong>Student:</strong> <code>A001</code> / <code>pass_A001</code></li>
            <li><strong>Teacher:</strong> <code>T001</code> / <code>pass_T001</code> (or email)</li>
            <li><strong>Staff:</strong> <code>S001</code> / <code>pass_S001</code></li>
        </ul>
    </div>
</body>
</html>
