<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Directory</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #4a90e2; color: white; }
    </style>
</head>
<body>
    <h1>School Student Directory</h1>
    
    <table>
        <thead>
            <tr>
                <th>Admission No</th>
                <th>Roll No</th>
                <th>First Name</th>
                <th>Standard</th>
                <th>House</th>
                <th>Remaining Fees</th>
            </tr>
        </thead>
        <tbody>
            <!-- Loop through the student list from the backend -->
            <tr th:each="s : ${studentList}">
                <td th:text="${s.admissionNo}">101</td>
                <td th:text="${s.rollNo}">1</td>
                <td th:text="${s.firstName}">John</td>
                <td th:text="${s.standard}">10</td>
                <td th:text="${s.house}">Red</td>
                <td th:text="${s.remainingFees}">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
