<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${directoryTitle}">Student Directory</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/students">Student Directory</a>
        <!-- When logged in -->
        <span th:if="${isLoggedIn}">
            <span th:if="${loggedInRole == 'student'}">
                <a href="/student/profile">My Profile</a>
                <a href="/student/subjects">My Subjects</a>
                <a href="/student/fees">My Fees</a>
            </span>
            <a th:if="${loggedInRole == 'teacher'}" href="/teacher/profile">My Profile</a>
            <a th:if="${loggedInRole == 'staff'}" href="/staff/profile">My Profile</a>
            <a th:if="${loggedInRole == 'admin'}" href="/admin/students">Admin Portal</a>
            <a href="/logout">Logout (<span th:text="${loggedInUser}">User</span>)</a>
        </span>
        <!-- When not logged in -->
        <span th:unless="${isLoggedIn}">
            <a href="/login">Login</a>
        </span>
    </nav>

    <h1 th:text="${directoryTitle}">Student Directory</h1>
    
    <table>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Admission No</th>
                <th>Name</th>
                <th>Class</th>
                <th>Section</th>
                <th>House</th>
                <th th:if="${loggedInRole != 'student'}">Remaining Fees</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${studentList}">
                <td th:text="${s.rollNo}">1</td>
                <td th:text="${s.admissionNo}">A001</td>
                <td th:text="${s.firstName} + (${s.lastName != null} ? ' ' + ${s.lastName} : '')">John Doe</td>
                <td th:text="${s.standard}">10</td>
                <td th:text="${s.division}">A</td>
                <td th:text="${s.house}">Red</td>
                <td th:if="${loggedInRole != 'student'}" th:text="'₹' + ${s.remainingFees}">0.0</td>
            </tr>
            <tr th:if="${#lists.isEmpty(studentList)}">
                <td colspan="6" style="text-align: center; color: #666;">No students found in this class and section.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
